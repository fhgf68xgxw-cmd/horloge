<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>NY Killzone Clock</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }
  #wrap {
    width: 100%;
    height: 100%;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    font-family: Helvetica, Arial, sans-serif;
  }
  #time {
    font-size: 14vw;
    font-weight: bold;
    color: #000000;
    letter-spacing: 1px;
    text-align: center;
  }
  #time.kz {
    color: #d40000;
  }
  #date {
    font-size: 3.5vw;
    color: #444444;
    margin-top: 8px;
    text-align: center;
  }
  #status {
    font-size: 4vw;
    font-weight: bold;
    margin-top: 16px;
    color: #888888;
    text-align: center;
  }
  #status.kz {
    color: #d40000;
  }
  #countdown {
    font-size: 3vw;
    color: #d40000;
    font-weight: bold;
    margin-top: 12px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="time">--:--:--</div>
  <div id="date">--</div>
  <div id="status">-</div>
  <div id="countdown"></div>
</div>

<script>
// Calcule l'heure de New York manuellement (pas besoin d'Intl, marche sur iOS 9)
function isUSDST(utcDate) {
  var year = utcDate.getUTCFullYear();
  // 2e dimanche de mars, 2h locale
  var marchSecondSunday = new Date(Date.UTC(year, 2, 1));
  var day = marchSecondSunday.getUTCDay();
  var offsetToFirstSunday = (7 - day) % 7;
  var firstSunday = 1 + offsetToFirstSunday;
  var secondSunday = firstSunday + 7;
  var dstStart = new Date(Date.UTC(year, 2, secondSunday, 7)); // 2am EST = 7am UTC

  // 1er dimanche de novembre, 2h locale
  var novFirst = new Date(Date.UTC(year, 10, 1));
  var novDay = novFirst.getUTCDay();
  var novOffsetToSunday = (7 - novDay) % 7;
  var novSunday = 1 + novOffsetToSunday;
  var dstEnd = new Date(Date.UTC(year, 10, novSunday, 6)); // 2am EDT = 6am UTC

  return utcDate.getTime() >= dstStart.getTime() && utcDate.getTime() < dstEnd.getTime();
}

function getNYTime() {
  var now = new Date();
  var utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
  var utcDate = new Date(utcMs);
  var offsetHours = isUSDST(utcDate) ? -4 : -5;
  var nyMs = utcMs + (offsetHours * 3600000);
  return new Date(nyMs);
}

var days = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function pad(n) {
  return n < 10 ? "0" + n : "" + n;
}

// --- Son ---

var soundReady = false;
function unlockSound() {
  if (soundReady) return;
  beep.play().then(function(){ beep.pause(); beep.currentTime = 0; soundReady = true; })
    .catch(function(){});
  soundReady = true;
}
document.body.addEventListener("touchstart", unlockSound);
document.body.addEventListener("click", unlockSound);

function playBeep() {
  if (!soundReady) return;
  try {
    beep.currentTime = 0;
    beep.play();
  } catch (e) {}
}

// --- Countdown ---
var prevZone = "none"; // none | pre | kz

function fmtCountdown(totalSeconds) {
  if (totalSeconds < 0) totalSeconds = 0;
  var m = Math.floor(totalSeconds / 60);
  var s = totalSeconds % 60;
  return pad(m) + ":" + pad(s);
}

function update() {
  var ny = getNYTime();
  var h24 = ny.getUTCHours();
  var m = ny.getUTCMinutes();
  var s = ny.getUTCSeconds();

  var ampm = h24 >= 12 ? "PM" : "AM";
  var h12 = h24 % 12;
  if (h12 === 0) h12 = 12;

  var timeStr = pad(h12) + ":" + pad(m) + " " + ampm;
  var dateStr = days[ny.getUTCDay()] + " " + ny.getUTCDate() + " " + months[ny.getUTCMonth()];

  // Killzone: 8:30 - 11:00 NY time (couvre premarket 8h30-9h30 + killzone 9h30-11h00)
  var secondsNow = h24 * 3600 + m * 60 + s;
  var kzStart = (8 * 60 + 30) * 60;
  var preEnd = (9 * 60 + 30) * 60;
  var kzEnd = (11 * 60 + 0) * 60;
  var inKZ = secondsNow >= kzStart && secondsNow < kzEnd;

  var timeEl = document.getElementById("time");
  var statusEl = document.getElementById("status");
  var dateEl = document.getElementById("date");
  var cdEl = document.getElementById("countdown");

  timeEl.innerHTML = timeStr;
  dateEl.innerHTML = dateStr + " - NY Time";

  var zone; // none | pre | kz
  var cdText = "";

  if (inKZ) {
    timeEl.className = "kz";
    statusEl.className = "kz";
    if (secondsNow < preEnd) {
      statusEl.innerHTML = "PRE-MARKET";
      zone = "pre";
    } else {
      statusEl.innerHTML = "KILLZONE";
      zone = "kz";
    }
  } else {
    timeEl.className = "";
    statusEl.className = "";
    statusEl.innerHTML = "-";
    zone = "none";

    // Compte a rebours 5 min avant kzStart
    var secsUntilStart;
    if (secondsNow < kzStart) {
      secsUntilStart = kzStart - secondsNow;
    } else {
      secsUntilStart = (24 * 3600 - secondsNow) + kzStart;
    }
    if (secsUntilStart <= 300) {
      cdText = fmtCountdown(secsUntilStart);
    }
  }

  cdEl.innerHTML = cdText;

  // Son sur transition d'entree de zone
  if (zone !== prevZone && (zone === "pre" || zone === "kz")) {
    playBeep();
  }
  prevZone = zone;
}

update();
setInterval(update, 1000);
</script>
</body>
</html>
