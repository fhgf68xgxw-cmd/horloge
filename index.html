<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>NY Killzone Clock</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }
  #wrap {
    width: 100%;
    height: 100%;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: horizontal;
    -webkit-flex-direction: row;
    flex-direction: row;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    font-family: Helvetica, Arial, sans-serif;
    flex-wrap: nowrap;
  }
  .clock-block {
    text-align: center;
    margin: 0 1.5vw;
  }
  .clock-label {
    font-size: 2.4vw;
    color: #666666;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .clock-time {
    font-size: 8vw;
    font-weight: bold;
    color: #000000;
    margin-top: 8px;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .clock-time.kz {
    color: #a30000;
  }
  .clock-time.pre {
    color: #b35900;
  }
  .clock-status {
    font-size: 2.6vw;
    font-weight: bold;
    color: #888888;
    margin-top: 10px;
    white-space: nowrap;
  }
  .clock-status.kz {
    color: #a30000;
  }
  .clock-status.pre {
    color: #b35900;
  }
  .clock-countdown {
    font-size: 1.8vw;
    color: #a30000;
    font-weight: bold;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div class="clock-block">
    <div class="clock-label">NEW YORK</div>
    <div class="clock-time" id="time">--:--</div>
    <div class="clock-status" id="status">-</div>
    <div class="clock-countdown" id="countdown"></div>
  </div>
  <div class="clock-block">
    <div class="clock-label">SYDNEY</div>
    <div class="clock-time" id="sydney-time">--:--</div>
    <div class="clock-status" id="sydney-status">-</div>
  </div>
  <div class="clock-block">
    <div class="clock-label">TOKYO</div>
    <div class="clock-time" id="tokyo-time">--:--</div>
    <div class="clock-status" id="tokyo-status">-</div>
  </div>
  <div class="clock-block">
    <div class="clock-label">LONDRES</div>
    <div class="clock-time" id="london-time">--:--</div>
    <div class="clock-status" id="london-status">-</div>
  </div>
</div>

<script>
// Calcule l'heure de New York manuellement (pas besoin d'Intl, marche sur iOS 9)
function isUSDST(utcDate) {
  var year = utcDate.getUTCFullYear();
  var marchSecondSunday = new Date(Date.UTC(year, 2, 1));
  var day = marchSecondSunday.getUTCDay();
  var offsetToFirstSunday = (7 - day) % 7;
  var firstSunday = 1 + offsetToFirstSunday;
  var secondSunday = firstSunday + 7;
  var dstStart = new Date(Date.UTC(year, 2, secondSunday, 7)); // 2am EST = 7am UTC

  var novFirst = new Date(Date.UTC(year, 10, 1));
  var novDay = novFirst.getUTCDay();
  var novOffsetToSunday = (7 - novDay) % 7;
  var novSunday = 1 + novOffsetToSunday;
  var dstEnd = new Date(Date.UTC(year, 10, novSunday, 6)); // 2am EDT = 6am UTC

  return utcDate.getTime() >= dstStart.getTime() && utcDate.getTime() < dstEnd.getTime();
}

function getNYTime() {
  var now = new Date();
  var utcMs = now.getTime(); // epoch UTC absolu
  var utcDate = new Date(utcMs);
  var offsetHours = isUSDST(utcDate) ? -4 : -5;
  var nyMs = utcMs + (offsetHours * 3600000);
  return new Date(nyMs);
}

// DST Europe : dernier dimanche mars 1h UTC -> dernier dimanche octobre 1h UTC
function isEUDST(utcDate) {
  var year = utcDate.getUTCFullYear();
  var marchBase = new Date(Date.UTC(year, 2, 31, 1));
  marchBase.setUTCDate(31 - marchBase.getUTCDay());
  var octBase = new Date(Date.UTC(year, 9, 31, 1));
  octBase.setUTCDate(31 - octBase.getUTCDay());
  var t = utcDate.getTime();
  return t >= marchBase.getTime() && t < octBase.getTime();
}

// DST Australie : 1er dimanche octobre 2h AEST -> 1er dimanche avril 3h AEDT
function isAUDST(utcDate) {
  var year = utcDate.getUTCFullYear();
  var octFirst = new Date(Date.UTC(year, 9, 1));
  var octOffset = (7 - octFirst.getUTCDay()) % 7;
  var octSunday = 1 + octOffset;
  var dstStart = new Date(Date.UTC(year, 9, octSunday, -8));

  var aprFirst = new Date(Date.UTC(year, 3, 1));
  var aprOffset = (7 - aprFirst.getUTCDay()) % 7;
  var aprSunday = 1 + aprOffset;
  var dstEnd = new Date(Date.UTC(year, 3, aprSunday, -8));

  var t = utcDate.getTime();
  if (t >= dstStart.getTime()) return true;
  if (t < dstEnd.getTime()) return true;
  return false;
}

function getCityTime(offsetFn) {
  var nowMs = new Date().getTime();
  var utcDate = new Date(nowMs);
  var offset = offsetFn(utcDate);
  return new Date(nowMs + offset * 3600000);
}

function getSydneyTime() {
  return getCityTime(function (d) { return isAUDST(d) ? 11 : 10; });
}
function getTokyoTime() {
  return getCityTime(function () { return 9; });
}
function getLondonTime() {
  return getCityTime(function (d) { return isEUDST(d) ? 1 : 0; });
}

function pad(n) {
  return n < 10 ? "0" + n : "" + n;
}

var soundReady = false;
function unlockSound() {
  if (soundReady) return;
  beep.play().then(function(){ beep.pause(); beep.currentTime = 0; soundReady = true; })
    .catch(function(){});
  soundReady = true;
}
document.body.addEventListener("touchstart", unlockSound);
document.body.addEventListener("click", unlockSound);

function playBeep() {
  if (!soundReady) return;
  try {
    beep.currentTime = 0;
    beep.play();
  } catch (e) {}
}

var prevZone = "none"; // none | pre | kz

function fmtCountdown(totalSeconds) {
  if (totalSeconds < 0) totalSeconds = 0;
  var m = Math.floor(totalSeconds / 60);
  var s = totalSeconds % 60;
  return pad(m) + ":" + pad(s);
}

function update() {
  var ny = getNYTime();
  var h24 = ny.getUTCHours();
  var m = ny.getUTCMinutes();
  var s = ny.getUTCSeconds();

  var timeStr = pad(h24) + ":" + pad(m);

  var secondsNow = h24 * 3600 + m * 60 + s;
  var kzStart = (8 * 60 + 30) * 60;
  var preEnd = (9 * 60 + 30) * 60;
  var kzEnd = (11 * 60 + 30) * 60;
  var inKZ = secondsNow >= kzStart && secondsNow < kzEnd;

  var nyDay = ny.getUTCDay(); // 0=Dim, 1=Lun ... 5=Ven, 6=Sam
  var marketClosed = false;
  if (nyDay === 6) {
    marketClosed = true;
  } else if (nyDay === 0 && secondsNow < 18 * 3600) {
    marketClosed = true;
  } else if (nyDay === 5 && secondsNow >= 17 * 3600) {
    marketClosed = true;
  } else if (nyDay >= 1 && nyDay <= 4 && secondsNow >= 17 * 3600 && secondsNow < 18 * 3600) {
    marketClosed = true;
  }

  var timeEl = document.getElementById("time");
  var statusEl = document.getElementById("status");
  var cdEl = document.getElementById("countdown");

  timeEl.innerHTML = timeStr;

  var zone; // none | pre | kz
  var cdText = "";

  if (marketClosed) {
    timeEl.className = "clock-time";
    statusEl.className = "clock-status";
    statusEl.innerHTML = "MARKET CLOSED";
    zone = "none";
  } else if (inKZ) {
    if (secondsNow < preEnd) {
      timeEl.className = "clock-time pre";
      statusEl.className = "clock-status pre";
      statusEl.innerHTML = "PRE-MARKET";
      zone = "pre";
    } else {
      timeEl.className = "clock-time kz";
      statusEl.className = "clock-status kz";
      statusEl.innerHTML = "KILLZONE";
      zone = "kz";
    }
  } else {
    timeEl.className = "clock-time";
    statusEl.className = "clock-status";
    statusEl.innerHTML = "-";
    zone = "none";

    var secsUntilStart;
    if (secondsNow < kzStart) {
      secsUntilStart = kzStart - secondsNow;
    } else {
      secsUntilStart = (24 * 3600 - secondsNow) + kzStart;
    }
    if (secsUntilStart <= 300) {
      cdText = fmtCountdown(secsUntilStart);
    }
  }

  cdEl.innerHTML = cdText;

  if (zone !== prevZone && (zone === "pre" || zone === "kz")) {
    playBeep();
  }
  prevZone = zone;

  updateSession(getSydneyTime(), "sydney", 8 * 3600, 17 * 3600, marketClosed);
  updateSession(getTokyoTime(), "tokyo", 9 * 3600, 18 * 3600, marketClosed);
  updateSession(getLondonTime(), "london", 8 * 3600, 17 * 3600, marketClosed);
}

function updateSession(cityDate, id, startSec, endSec, marketClosed) {
  var h = cityDate.getUTCHours();
  var m = cityDate.getUTCMinutes();
  var s = cityDate.getUTCSeconds();
  var secs = h * 3600 + m * 60 + s;
  var inKZ = secs >= startSec && secs < endSec;

  var timeEl = document.getElementById(id + "-time");
  var statusEl = document.getElementById(id + "-status");

  timeEl.innerHTML = pad(h) + ":" + pad(m);

  if (marketClosed) {
    timeEl.className = "clock-time";
    statusEl.className = "clock-status";
    statusEl.innerHTML = "MARKET CLOSED";
  } else if (inKZ) {
    timeEl.className = "clock-time kz";
    statusEl.className = "clock-status kz";
    statusEl.innerHTML = "KILLZONE";
  } else {
    timeEl.className = "clock-time";
    statusEl.className = "clock-status";
    statusEl.innerHTML = "-";
  }
}

update();
setInterval(update, 1000);

// Auto-reload toutes les heures pile (evite bugs sur longue duree)
(function scheduleHourlyReload() {
  var now = new Date();
  var msToNextHour = (60 - now.getMinutes()) * 60000 - now.getSeconds() * 1000 - now.getMilliseconds();
  setTimeout(function() {
    location.reload();
  }, msToNextHour);
})();
</script>
